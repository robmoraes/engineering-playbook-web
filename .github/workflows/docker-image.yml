name: Docker image

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

env:
  IMAGE_NAME: carlosmoraesrodrigues/engineering-playbook-web

jobs:
  candidate:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    name: Docker candidate build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read artifact inputs
        id: inputs
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          content_ref="$(node --print "require('./content-source.json').ref")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "content_ref=${content_ref}" >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Engineering Playbook Web
            org.opencontainers.image.description=Static SPA presentation layer for the Engineering Playbook
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.inputs.outputs.version }}
            dev.carlosmoraesrodrigues.engineering-playbook.content.ref=${{ steps.inputs.outputs.content_ref }}

      - name: Build and conditionally publish candidate image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record candidate evidence
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          {
            echo "## Published Docker candidate"
            echo
            echo "- Web source commit: \`${GITHUB_SHA}\`"
            echo "- Content source ref: \`${{ steps.inputs.outputs.content_ref }}\`"
            echo "- Candidate tag: \`${IMAGE_NAME}:sha-${GITHUB_SHA}\`"
            echo "- Image digest: \`${{ steps.build.outputs.digest }}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    name: Docker release promotion
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read artifact inputs
        id: inputs
        shell: bash
        run: |
          version="$(node --print "require('./package.json').version")"
          content_ref="$(node --print "require('./content-source.json').ref")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"
          echo "content_ref=${content_ref}" >> "${GITHUB_OUTPUT}"

      - name: Verify release tag matches package version
        shell: bash
        run: |
          if [ "${GITHUB_REF_NAME}" != "${{ steps.inputs.outputs.tag }}" ]; then
            echo "Git tag ${GITHUB_REF_NAME} does not match package.json version ${{ steps.inputs.outputs.version }}."
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Promote published candidate digest
        shell: bash
        env:
          CANDIDATE_TAG: ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          RELEASE_TAG: ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
        run: |
          docker buildx imagetools inspect \
            "${CANDIDATE_TAG}" \
            --format '{{json .Manifest}}' > candidate-manifest.json

          candidate_digest="$(
            node --print "JSON.parse(require('fs').readFileSync('candidate-manifest.json', 'utf8')).digest"
          )"

          if [[ ! "${candidate_digest}" =~ ^sha256:[a-f0-9]{64}$ ]]; then
            echo "Unable to resolve an immutable digest for ${CANDIDATE_TAG}."
            exit 1
          fi

          docker buildx imagetools create \
            --tag "${RELEASE_TAG}" \
            --prefer-index=false \
            "${IMAGE_NAME}@${candidate_digest}"

          docker buildx imagetools inspect \
            "${RELEASE_TAG}" \
            --format '{{json .Manifest}}' > release-manifest.json

          release_digest="$(
            node --print "JSON.parse(require('fs').readFileSync('release-manifest.json', 'utf8')).digest"
          )"

          if [ "${release_digest}" != "${candidate_digest}" ]; then
            echo "Release digest ${release_digest} does not match candidate digest ${candidate_digest}."
            exit 1
          fi

          {
            echo "## Promoted Docker release"
            echo
            echo "- Web source commit: \`${GITHUB_SHA}\`"
            echo "- Content source ref: \`${{ steps.inputs.outputs.content_ref }}\`"
            echo "- Candidate tag: \`${CANDIDATE_TAG}\`"
            echo "- Release tag: \`${RELEASE_TAG}\`"
            echo "- Image digest: \`${candidate_digest}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
